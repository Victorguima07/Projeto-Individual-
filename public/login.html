<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Alma Corinthiana | Login</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/login.css" />
  <link rel="icon" href="./assets/icon/favicon.jpg" />

</head>

<body onload="listar()">
  <!--header inicio-->
  <header class="header">
    <div id="div-img">
      <a href="index.html"><img id="img-header" src="./assets/Logo-site.png" alt="Logo do site"></a>
    </div>
    <div id="div-nav">
      <ul>
          <a href="index.html">
          <li>Início</li>
        </a>
        <a href="historia.html">
          <li> História do Timão</li>
        </a>
        <a href="quiz.html">
        <li> Quiz Fiel</li>
      </a>
        </a>
        <a href="cadastro.html">
          <li>Cadastro</li>
        </a>
        <a href="login.html">
          <li><img src="./assets/icon/user.png" alt="profile" style="width: 15px;">Login</li>
        </a>
      </ul>
    </div>
  </header>
  <!--header fim-->
  <main>
    <section>
      <div class="contenier-cadastro">
        <div class="conteiner-form">
          <div id="conteiner-img">
            <img src="./assets/DeWatermark.ai_1762454841950.jpeg" alt="">
          </div>
          <div class="formulario">
            <h3>Faça Login para acessar o site.</h3>
            <p>Não possui cadastro? <a href="cadastro.html">Cadastrar</a></p>
            <br>
            <div class="campo">
              <span>E-mail:</span>
              <input id="email_input" type="text" placeholder="nome@exemplo.com.br">
            </div>
            <br>
            <div class="campo">
              <span>Senha:</span>
              <input id="senha_input" type="password" placeholder="*******">
            </div>
            <br>
            <button onclick="entrar()">Entrar</button>

            <div class="alerta_erro">
              <div class="card_erro" id="cardErro">
                <div id="mensagem"></div>
              </div>

            </div>
          </div>

    </section>

  </main>
</body>

</html>
<script>

  function entrar() {
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    mensagem.innerHTML = ``;
    if (!emailVar || !senhaVar) {
      mensagem.innerHTML = `Preencha todos os campos!`;
      return;
    }

    fetch("/usuarios/autenticar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: emailVar,
        senha: senhaVar
      })
    })
      .then(resposta => {
        if (resposta.ok) {
          return resposta.json();
        } else {
          throw "Email ou senha inválidos!";
        }
      })
      .then(json => {
        sessionStorage.ID_USUARIO = json.idUsuario;
        sessionStorage.NOME = json.nome;
        sessionStorage.USERNAME = json.nomeUsuario;
        sessionStorage.EMAIL = json.email;

        window.location = "./dashboard/registros.html";
      })
      .catch(erro => {
        mensagem.innerHTML = erro;
        console.error("ERRO NO LOGIN:", erro);
      });
  }

</script>

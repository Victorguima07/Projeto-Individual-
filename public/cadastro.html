<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Alma Corinthiana | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadastro.css" />
  <link rel="icon" href="./assets/icon/favicon.jpg" />

</head>

<body onload="listar()">
  <!--header inicio-->
  <header class="header">
    <div id="div-img">
      <a href="index.html"><img id="img-header" src="./assets/Logo-site.png" alt="Logo do site"></a>
    </div>
    <div id="div-nav">
      <ul>
        <a href="#sobre">
          <li> Minha História</li>
        </a>
        <a href="historia.html">
          <li> História do Timão</li>
        </a>
        </a>
        <a href="cadastro.html">
          <li>Cadastro</li>
        </a>
        <a href="login.html">
          <li><img src="./assets/icon/user.png" alt="profile" style="width: 15px;">Login</li>
        </a>
      </ul>
    </div>
  </header>
  <!--header fim-->
  <main>
    <section>
        <div class="contenier-cadastro">
          <div class="conteiner-form">
            <div id="conteiner-img">
            <img src="./assets/DeWatermark.ai_1762454841950.jpeg" alt="">
            </div>
            <div class="formulario">
              <h2>Bem vindo</h2>
              <h3>Insira suas informações pessoais para criar sua conta.</h3>
              <p>Você ja tem uma conta? <a href="login.html">Entrar</a></p>
              <br>
              <div class="campo">
                <span>Usuário:</span>
                <input id="usuario_input" type="text" placeholder="Usuário">
              </div>
              <br>
              <div class="campo">
                <span>Nome:</span>
                <input id="nome_input" type="text" placeholder="Nome Completo">
              </div>
              <br>
              <div class="campo">
                <span>E-mail:</span>
                <input id="email_input" type="text" placeholder="nome@exemplo.com.br">
              </div>
              <br>
              <div class="campo">
                <span>Senha:</span>
                <input id="senha_input" type="password" placeholder="*******">
              </div>
              <br>
              <div class="campo">
                <span>Confirmar Senha:</span>
                <input id="confirmarSenha_input" type="text" placeholder="*******">
              </div>
              <br>
              <button onclick="cadastrar()">Cadastrar</button>

            </div>
          </div>
      
    </section>




  </main>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alma Corinthiana | Registro de Jogos</title>

    <link rel="stylesheet" href="./../css/registros.css">
    <!-- <link rel="stylesheet" href="./../css/estilo.css" /> -->
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

</head>

<body onload="validarSessao()">

    <div class="janela">


        <div class="header-left">

            <div id="div-img">
                <a href="index.html"><img id="img-header" src="../assets/Logo-site.png" alt="Logo do site"></a>
            </div>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="registros.html">
                    <img src="../assets/icon/registro.png" alt="registro">
                    <h3>Registro de Jogos</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <img src="../assets/icon/dash.png" alt="dash-icon">
                    <h3>Meu Desempenho no Estádio</h3>
                </a>
            </div>

            <div id="" class="btn-logout" onclick="limparSessao()">
                <img src="../assets/icon/saida.png" alt="sair">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash-right">
            <div class="registro-conteiner">
                <div id="div-titulo">
                    <h2>Registro de Jogos Assistidos</h2>
                </div>
                <div id="form-registro">
                    <div id="campo-data">
                        <span>Data do jogo:</span><br>
                        <input type="date" id="iptDataJogo">
                    </div>
                    <br>
                    <div>
                        <span>Local do Jogo:</span><br>
                        <select name="selectLocal" id="slcLocal">
                            <option value="0">Selecione...</option>
                            <option value="Arena">Arena</option>
                            <option value="Fora">Fora</option>
                        </select>
                    </div>
                    <br>

                    <br>
                    <div>
                        <span>Resultado do Jogo:</span><br>
                        <select name="selectResultado" id="slcResultado">
                            <option value="0">Selecione...</option>
                            <option value="Vitória">Vitória</option>
                            <option value="Empate">Empate</option>
                            <option value="Derrota">Derrota</option>
                        </select>
                    </div>
                </div>
                <button onclick="registrar()">Registrar</button>
            </div>
            <div>
                <div id="divResultado" style="display: none;"></div>

            </div>
        </div>
    </div>
</body>
<script>

    function validarSessao() {
        var username = sessionStorage.USERNAME;

        var b_usuario = document.getElementById("b_usuario");

        if (username != null) {
            b_usuario.innerHTML = username;
        } else {
            window.location = "../login.html";
        }
    }

    function registrar() {

        let data = iptDataJogo.value;
        let localJogo = slcLocal.value;
        let resultadoJogo = slcResultado.value;

        divResultado.innerHTML = ``;

        if (data == '' || localJogo == '0' || resultadoJogo == '0') {
            divResultado.innerHTML = `Por favor, preencha todos os campos`;
            return;
        }
        var ValidacaoPrompt = false;

        while (!ValidacaoPrompt) {

            var resposta = prompt("Deseja registrar os dados? (sim / não)");

            if (resposta === null) {
                alert("Registro cancelado.");
                ValidacaoPrompt = true;
                break;
            }

            resposta = resposta.trim().toLowerCase();

            if (resposta == "sim") {

                ValidacaoPrompt = true;

                fetch("/registro/registrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        idUsuario: sessionStorage.ID_USUARIO,
                        dataPartida: data,
                        local: localJogo,
                        resultado: resultadoJogo
                    })
                })
                    .then(res => {
                        if (res.ok) {
                            divResultado.innerHTML = `
                        <h3 class="resultado-titulo"> Dados Registrados: </h3>
                        <p class="resultado-linha"> <b>Data:</b> ${data}</p>
                        <p class="resultado-linha"> <b>Local:</b> ${localJogo}</p>
                        <p class="resultado-linha"> <b>Resultado:</b> ${resultadoJogo}</p>
                    `;
                            divResultado.style.display = 'block';
                        } else {
                            throw "Erro ao registrar no banco!";
                        }
                    })
                    .catch(erro => {
                        console.error("ERRO NO REGISTRO:", erro);
                        alert("Ocorreu um erro ao registrar.");
                    });

            } else if (resposta == "não" || resposta == "nao") {
                ValidacaoPrompt = true;
                alert("Registro cancelado.");
            } else {
                alert("Resposta inválida! Digite apenas 'sim' ou 'não'.");
                ValidacaoPrompt = false;
            }
        }
    }

   function limparSessao(){
    window.location.href = "../login.html";

   }


</script>

</html>

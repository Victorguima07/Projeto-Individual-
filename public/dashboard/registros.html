<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alma Corinthiana | Registro de Jogos</title>

    <link rel="stylesheet" href="./../css/registros.css">
    <!-- <link rel="stylesheet" href="./../css/estilo.css" /> -->
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

</head>

<body>
    <div class="janela">


        <div class="header-left">

            <h1>Alma Corinthiana</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="registros.html">
                    <h3>Registro de Jogos</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Meu Desempenho no Estádio</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash-right">
            <div>
                <h2>Registro de Jogos Assistidos</h2>
                <div>
                    <span>Data do jogo:</span><br>
                    <input type="date" id="iptDataJogo">
                </div>
                <br>
                <div>
                    <span>Local do Jogo:</span><br>
                    <select name="selectLocal" id="slcLocal">
                        <option value="0">Selecione...</option>
                        <option value="Arena">Arena</option>
                        <option value="Fora">Fora</option>
                    </select>
                </div>
                <br>

                <br>
                <div>
                    <span>Resultado do Jogo:</span><br>
                    <select name="selectResultado" id="slcResultado">
                        <option value="0">Selecione...</option>
                        <option value="Vitória">Vitória</option>
                        <option value="Empate">Empate</option>
                        <option value="Derrota">Derrota</option>
                    </select>
                </div>
                <br><br>
                <button onclick="registrar()">Registrar</button>
            </div>
            <div>
                <div id="divResultado"></div>
            </div>
        </div>
    </div>
</body>
<script>

    function registrar() {
        let data = iptDataJogo.value;

        let localJogo = slcLocal.value;
        let resultadoJogo = slcResultado.value;


        divResultado.innerHTML = ``;

        if (data == '' || localJogo == '0' || resultadoJogo == '0') {
            divResultado.innerHTML = `Por favor, preencha todos os campos`;
        } else {

            var ValidacaoPrompt = false;

            while (!ValidacaoPrompt) {
                var resposta = prompt("Deseja registrar os dados? (sim / não)");

                if (resposta === null) {

                    alert("Registro cancelado.");
                    ValidacaoPrompt = true;
                    break;
                }

                resposta = resposta.trim().toLowerCase();

                if (resposta == "sim") {
                    ValidacaoPrompt = true;
                    divResultado.innerHTML = `<h3> Dados Registrados: </h3>
                <b> Data:</b> ${data}<br><b> Local:</b> ${localJogo}<br><b>Resultado:</b> ${resultadoJogo}<br>`;
                }else if(resposta == "não" || resposta == "nao"){
                    ValidacaoPrompt = true;
                    alert("Registro cancelado.");
            }else {
                    alert("Resposta inválida! Digite apenas 'sim' ou 'não'.");
                    ValidacaoPrompt = false;
                }
            }
        }
    }



</script>

</html>

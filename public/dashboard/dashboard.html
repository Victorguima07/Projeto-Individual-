<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alma Corinthiana | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../css/dashboards.css" />
</head>

<body onload="validarSessao()">

    <div class="janela">


        <div class="header-left">

            <div id="div-img">
                <a href="index.html"><img id="img-header" src="../assets/Logo-site.png" alt="Logo do site"></a>
            </div>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="registros.html">
                    <img src="../assets/icon/registro.png" alt="registro">
                    <h3>Registro de Jogos</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <img src="../assets/icon/dash.png" alt="dash-icon">
                    <h3>Meu Desempenho no Estádio</h3>
                </a>
            </div>

            <div id="" class="btn-logout" onclick="limparSessao()">
                <img src="../assets/icon/saida.png" alt="sair">
                <h3>Sair</h3>
            </div>

        </div>


        <div class="dash-right">


            <div class="kpi-conteiner">

                <div class="kpi-card">
                    <h3>Total de jogos:</h3>
                    <span id="kpiTotalJogos">0</span>
                </div>

                <div class="kpi-card">
                    <h3>Total de Jogos na Arena:</h3>
                    <span id="kpiTotalArena">0</span>
                </div>

                <div class="kpi-card">
                    <h3>Total de Jogos Fora:</h3>
                    <span id="kpiTotalFora">0</span>
                </div>

                <div class="kpi-card">
                    <h3>Total de Vitórias:</h3>
                    <span id="kpiTotalVitorias">0</span>
                </div>
            </div>
            <div class="kpi-conteiner2">
                <div class="kpi-card">
                    <h3>Total de Empates:</h3>
                    <span id="kpiTotalEmpates">0</span>
                </div>

                <div class="kpi-card">
                    <h3>Total de Derrotas:</h3>
                    <span id="kpiTotalDerrotas">0</span>
                </div>

                <div class="kpi-card">
                    <h3>Aproveitamento Geral:</h3>
                    <span id="kpiAproveitamento">0%</span>
                </div>

                <div class="kpi-card">
                    <h3>Último Jogo Assistido:</h3>
                    <span id="kpiAssistido">-</span>
                </div>
            </div>


            <div class="graficos-container">
                <div class="grafico">
                     <h3 class="titulo-grafico">Resultados</h3>
                    <canvas id="Grafico1"></canvas>
                </div>

                <div class="grafico">
                      <h3 class="titulo-grafico">Jogos Casa/Fora</h3>
                    <canvas id="Grafico2"></canvas>
                </div>
            </div>
        </div>
</body>
<script>
      function validarSessao() {
        var username = sessionStorage.USERNAME;

        var b_usuario = document.getElementById("b_usuario");

        if (username != null) {
            b_usuario.innerHTML = sessionStorage.USERNAME;
        } else {
            window.location = "../login.html";
        }
    }

    let proximaAtualizacao;

 window.onload = function () {
    validarSessao();
    carregarKPIs();
    obterDadosGraficos();
};

    function carregarKPIs() {
        fetch(`/dashboard/listar/${sessionStorage.ID_USUARIO}`)
            .then(resposta => resposta.json())
            .then(dados => {
                processarKPIs(dados);
            })
            .catch(erro => {
                console.error("Erro no carregamento dos KPIs:", erro);
            });
    }

    function processarKPIs(dados) {

        let totalJogos = dados.length;
        let totalArena = 0;
        let totalFora = 0;
        let vitorias = 0;
        let empates = 0;
        let derrotas = 0;
        let ultimoJogo = "-";

        for (i = 0; i < dados.length; i++) {
            var jogo = dados[i];

            if (jogo.local == "Arena") {
                totalArena++;
            } else {
                totalFora++;
            }


            if (jogo.resultado == "Vitória") {
                vitorias++;
            } else if (jogo.resultado == "Empate") {
                empates++;
            } else if (jogo.resultado == "Derrota") {
                derrotas++;
            }

            ultimoJogo = jogo.dataFormatada;
        }

        let aproveitamento = 0;
        if (totalJogos > 0) {
            aproveitamento = ((vitorias * 3 + empates) / (totalJogos * 3)) * 100;
        }

        kpiTotalJogos.innerHTML = totalJogos;
        kpiTotalArena.innerHTML = totalArena;
        kpiTotalFora.innerHTML = totalFora;
        kpiTotalVitorias.innerHTML = vitorias;
        kpiTotalEmpates.innerHTML = empates;
        kpiTotalDerrotas.innerHTML = derrotas;
        kpiAproveitamento.innerHTML = aproveitamento.toFixed(1) + "%";
        kpiAssistido.innerHTML = dados[0].data;
    }

    function obterDadosGraficos() {

        fetch(`/dashboard/listar/${sessionStorage.ID_USUARIO}`, { cache: "no-store" })
            .then(function (response) {

                if (response.ok) {
                    response.json().then(function (dados) {
                        plotarGraficoPizza(dados);
                        plotarGraficoBarras(dados);

                    });
                } else {
                    console.error("Nenhum dado encontrado");
                }
            })
            .catch(function (error) {
                console.error("Erro ao obter dados dos gráficos:", error.message);
            });

    }

    function plotarGraficoPizza(dados) {
        let vitorias = 0;
        let empates = 0;
        let derrotas = 0;

        for (i = 0; i < dados.length; i++) {
            var jogo = dados[i];

            if (jogo.resultado == "Vitória") {
                vitorias++;
            }
            if (jogo.resultado == "Empate") {
                empates++;
            }
            if (jogo.resultado == "Derrota") {
                derrotas++;
            }
        }

        let ctx = document.getElementById("Grafico1");

        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ["Vitórias", "Empates", "Derrotas"],
                datasets: [{
                    data: [vitorias, empates, derrotas],
                    backgroundColor: ["#DAA520", "#A9A9A9", "#FF1B1C"]
                }]
            }
        });
    }

    function plotarGraficoBarras(dados) {

        let labels = [];
        let jogosArena = [];
        let jogosFora = [];

        for (i = 0; i < dados.length; i++) {
            let jogo = dados[i];

            labels.push(jogo.dataFormatada);

            if (jogo.local == "Arena") {
                jogosArena.push(1);
                jogosFora.push(0);
            } else {
                jogosArena.push(0);
                jogosFora.push(1);
            }
        }

        let ctx = document.getElementById("Grafico2");

        new Chart(ctx, {
            type: "bar",
            data: {
                labels: labels,
                datasets: [{
                    label: "Jogos na Arena",
                    data: jogosArena,
                    backgroundColor: "#0A0000"
                },
                {
                    label: "Jogos Fora",
                    data: jogosFora,
                    backgroundColor: "#FF1B1C"
                }]
            }
        });

    }

  function limparSessao() {
    window.location.href = "../login.html";
}


</script>

</html>
